server.port=8080
server.servlet.context-path=/api

# Application name
spring.application.name=SuperMarket Management System

# SQLite Configuration
spring.datasource.url=jdbc:sqlite:supermarket.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging
logging.level.root=INFO
logging.level.com.supermarket=DEBUG
logging.level.org.springframework.security=DEBUG

# JWT Configuration
jwt.secret=your_super_secret_jwt_key_change_this_in_production_environment_please
jwt.expiration=86400000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Session Configuration
server.servlet.session.timeout=30m
